name: Notify
description: Send a notification via webhook to Slack.

inputs:
  webhook_url:
    description: Slack trigger webhook URL for this event
    required: true
  slack_id:
    description: Slack user/owner id (from secrets.SLACKID)
    required: true
  data:
    description: JSON stringify data
    required: false

runs:
  using: composite
  steps:
    - name: Send notification
      # Never fire while running locally under act (https://nektosact.com): the
      # webhook is a real Slack trigger. act sets ACT=true in the job environment;
      # on GitHub the variable is unset, so this is a no-op there. Must stay at
      # step level -- `env` is not an allowed context in a job-level `if`.
      if: ${{ !env.ACT }}
      uses: fjogeleit/http-request-action@v2
      continue-on-error: true
      with:
        url: ${{ inputs.webhook_url }}
        method: "POST"
        customHeaders: '{"Content-Type": "application/json"}'
        data: ${{ inputs.data != '' && inputs.data || format('{{"owner":"{0}","repoName":"{1}","branch":"{2}","buildUrl":"{3}/{1}/actions/runs/{4}","slackUserId":"{5}"}}', github.repository_owner, github.repository, github.ref_name || github.head_ref, github.server_url, github.run_id, inputs.slack_id) }}
