name: Push Code
description: Commit and push whatever is in the working tree, as an auto deploy commit.

inputs:
  should_deploy:
    description: Gate from setup-git's should_deploy output; skips this action when not 'true'
    required: true
  commit_message:
    description: Commit message (a timestamp is appended if it doesn't already contain one)
    required: false
    default: "Auto deploy"

runs:
  using: composite
  steps:
    - name: Push code
      if: inputs.should_deploy == 'true'
      shell: bash
      env:
        TZ: Asia/Ho_Chi_Minh
      run: |
        MESSAGE="${{ inputs.commit_message }} ${{ github.ref_name }} $(date +'%H:%M:%S %d/%m/%Y')"
        git commit --allow-empty -m "$MESSAGE" -n
        git push
        echo "$MESSAGE"
